# Lint, type-check and test on push/PR. Ported from .github/workflows/ci.yml for the
# homelab Forgejo. The Codecov upload was dropped: it targets an external SaaS that
# needs a token, which makes no sense for a now-private repo whose runner is
# firewalled — coverage still runs and the job fails under 99%, it just is not shipped.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    # node-22 (git + node preinstalled); the runner has no `ubuntu-slim` label.
    runs-on: node-22
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy --strict src/blocklist_builder

      - name: Tests + coverage
        run: |
          PYTHONPATH=src uv run pytest --cov=blocklist_builder --cov-report=term-missing --cov-fail-under=99
