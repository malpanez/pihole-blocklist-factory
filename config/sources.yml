# Fuentes declaradas manualmente. Las fuentes auto-generadas de Firebog se cargan
# desde config/sources.firebog.yml (generado por: blocklist-factory sync-firebog)
# Campos soportados:
# - id: string único
# - name: nombre legible
# - category: advertising|tracking|malicious|suspicious|other|telemetry
# - url: http(s)://... | file://... | relative path
# - enabled: true/false
# - tier: stable|edge
# - license: texto corto o URL
# - notes: riesgo/observaciones
# - json_key: (opcional) fuente JSON; se usa solo el array de strings bajo esta clave de primer nivel

sources:
  - id: sample_local
    name: "Sample local list"
    category: advertising
    url: "inputs/sample_lists/example_hosts.txt"
    enabled: true
    tier: stable
    license: "internal sample"
    notes: "Lista local mínima para CI/offline."

  # ============================================================================
  # HaGeZi DNS Blocklists - https://github.com/hagezi/dns-blocklists
  # Muy alta calidad, mantenidas activamente, amplia cobertura
  # ============================================================================
  - id: hagezi_pro
    name: "HaGeZi Pro"
    category: advertising
    url: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt"
    enabled: true
    tier: stable
    license: "GPL-3.0"
    notes: "HaGeZi Pro: ads, tracking, analytics. Wildcard format is right because Technitium block lists are hierarchical; jsDelivr @latest/domains returned 403."

  - id: hagezi_tif
    name: "HaGeZi Threat Intelligence Feeds"
    category: malicious
    url: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif-onlydomains.txt"
    enabled: true
    tier: stable
    license: "GPL-3.0"
    notes: "Threat intelligence: malware, phishing, scam, cryptojacking. Wildcard format is right because Technitium block lists are hierarchical; jsDelivr @latest/domains returned 403."

  # HaGeZi Fake - No disponible como lista separada (incluida en TIF)
  # - id: hagezi_fake
  #   name: "HaGeZi Fake"
  #   category: malicious
  #   url: "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/domains/fake.txt"
  #   enabled: false

  # ============================================================================
  # OISD Blocklist - https://oisd.nl/
  # Lista curada manualmente, muy baja tasa de falsos positivos
  # ============================================================================
  # OISD - https://oisd.nl/
  # Mirror GitHub (servidores oficiales devuelven 410 Gone desde 2024)
  # Formato: domainswild2 (domain-only, un dominio por línea)
  - id: oisd_big
    name: "OISD Big"
    category: advertising
    url: "https://raw.githubusercontent.com/sjhgvr/oisd/main/domainswild2_big.txt"
    enabled: true
    tier: stable
    license: "MIT"
    notes: "OISD Big - ads, tracking, malware. 256k dominios. Muy curada."

  - id: oisd_nsfw
    name: "OISD NSFW"
    category: suspicious
    url: "https://raw.githubusercontent.com/sjhgvr/oisd/main/domainswild2_nsfw.txt"
    enabled: false
    tier: stable
    license: "MIT"
    notes: "Contenido adulto. Deshabilitada por defecto."

  # ============================================================================
  # 1Hosts - https://github.com/badmojr/1Hosts
  # Listas minimalistas y agresivas
  # ============================================================================
  - id: 1hosts_lite
    name: "1Hosts Lite"
    category: advertising
    url: "https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/domains.txt"
    enabled: false
    tier: stable
    license: "MPL-2.0"
    notes: "Disabled: blocks anti-fraud and API hosts on household traffic (api.fraud0.com, service2.us.incognia.com, a-api.anthropic.com, mirrors.hostiserver.com); HaGeZi advises against stacking multi lists; last push 2026-09."

  - id: 1hosts_pro
    name: "1Hosts Pro"
    category: advertising
    url: "https://raw.githubusercontent.com/badmojr/1Hosts/master/Pro/domains.txt"
    enabled: false
    tier: edge
    license: "MPL-2.0"
    notes: "Lista agresiva - puede generar falsos positivos. Deshabilitada por defecto."

  # ============================================================================
  # StevenBlack Hosts - https://github.com/StevenBlack/hosts
  # Consolidación clásica de múltiples fuentes
  # ============================================================================
  - id: stevenblack_unified
    name: "StevenBlack Unified Hosts"
    category: advertising
    url: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
    enabled: true
    tier: stable
    license: "MIT"
    notes: "Consolidación de adaway, mvps, malwaredomainlist, etc."

  # ============================================================================
  # URLhaus - https://urlhaus.abuse.ch/
  # Malware y URLs maliciosas
  # ============================================================================
  - id: urlhaus_online
    name: "URLhaus Malware URLs"
    category: malicious
    url: "https://urlhaus.abuse.ch/downloads/hostfile/"
    enabled: false
    tier: stable
    license: "CC0"
    notes: "Disabled: returns 410 and needs an Auth-Key; replaced by urlhaus_filter."

  # ============================================================================
  # NoTracking - https://github.com/notracking/hosts-blocklists
  # Tracking y telemetría
  # ============================================================================
  - id: notracking_tracker
    name: "NoTracking Trackers"
    category: tracking
    url: "https://raw.githubusercontent.com/notracking/hosts-blocklists/master/dnscrypt-proxy/dnscrypt-proxy.blacklist.txt"
    enabled: false
    tier: stable
    license: "GPL-3.0"
    notes: "Disabled: repo archived 2023-06."

  # ============================================================================
  # Listas específicas para publicidad móvil (Unity Ads, AdMob, AppLovin, etc.)
  # ============================================================================
  - id: mobile_ads_xorro
    name: "Mobile Ads (x-o-r-r-o)"
    category: advertising
    url: "https://raw.githubusercontent.com/x-o-r-r-o/Pi-Hole-Block-Lists/master/mobile-ads.txt"
    enabled: true
    tier: stable
    license: "MIT"
    notes: "Anuncios móviles - Unity, AdMob, AppLovin, Vungle, IronSource. ~1000 dominios."

  - id: ads_tracking_xorro
    name: "Ads and Tracking (x-o-r-r-o)"
    category: advertising
    url: "https://raw.githubusercontent.com/x-o-r-r-o/Pi-Hole-Block-Lists/master/ads-and-tracking.txt"
    enabled: true
    tier: stable
    license: "MIT"
    notes: "Lista consolidada de ads y tracking."

  - id: pyenb_blocklist
    name: "Pyenb Comprehensive Blocklist"
    category: advertising
    url: "https://raw.githubusercontent.com/Pyenb/Pi-hole-blocklist/refs/heads/main/blocklist.txt"
    enabled: false
    tier: edge
    license: "MIT"
    notes: "Disabled: 4.5M entries, over the 64 MB download cap; historic false-positive source."

  - id: blocklistproject_ads
    name: "BlocklistProject Ads"
    category: advertising
    url: "https://blocklistproject.github.io/Lists/ads.txt"
    enabled: false
    tier: stable
    license: "MIT"
    notes: "Disabled: repo archived."

  - id: perflyst_smarttv
    name: "Perflyst Smart-TV Ads"
    category: advertising
    url: "https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt"
    enabled: true
    tier: stable
    license: "MIT"
    notes: "Bloquea anuncios en Smart TVs y dispositivos de streaming."

  - id: perflyst_android
    name: "Perflyst Android Tracking"
    category: tracking
    url: "https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/android-tracking.txt"
    enabled: true
    tier: stable
    license: "MIT"
    notes: "Tracking específico de Android."

  # ============================================================================
  # Phishing
  # ============================================================================
  - id: openphish
    name: "OpenPhish Feed"
    category: malicious
    url: "https://openphish.com/feed.txt"
    enabled: false
    tier: stable
    license: "CC BY-NC-SA 4.0"
    notes: "Disabled: the feed is full URLs, every line is rejected by sanitize, and hosts from URL feeds are not safe to block whole (shared hosting)."

  - id: phishing_army
    name: "Phishing Army"
    category: malicious
    url: "https://phishing.army/download/phishing_army_blocklist.txt"
    enabled: false
    tier: stable
    license: "CC BY-NC-SA 4.0"
    notes: "Disabled: near-identical subset of the firebog extended list."

  # ============================================================================
  # Malware adicional
  # ============================================================================
  - id: cert_pl
    name: "CERT Poland Malware Domains"
    category: malicious
    url: "https://hole.cert.pl/domains/domains.txt"
    enabled: true
    tier: stable
    license: "free to use"
    notes: "Dominios maliciosos reportados por CERT Poland. Muy activa, actualizada diariamente."

  # ============================================================================
  # EasyPrivacy - tracking agresivo
  # ============================================================================
  - id: easyprivacy_hosts
    name: "EasyPrivacy Hosts"
    category: tracking
    url: "https://v.firebog.net/hosts/Easyprivacy.txt"
    enabled: false
    tier: stable
    license: "GPL-3.0"
    notes: "Disabled: same URL as firebog_tracking_1_easyprivacy."

  # ============================================================================
  # HaGeZi Gambling
  # ============================================================================
  - id: hagezi_gambling
    name: "HaGeZi Gambling"
    category: suspicious
    url: "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/domains/gambling.txt"
    enabled: false
    tier: stable
    license: "GPL-3.0"
    notes: "Sitios de apuestas y juegos de azar. Deshabilitada por defecto."

  # ============================================================================
  # URLhaus filter + MetaMask phishing
  # ============================================================================
  - id: urlhaus_filter
    name: "URLhaus Filter (malware-filter)"
    category: malicious
    url: "https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-domains.txt"
    enabled: true
    tier: stable
    license: "https://gitlab.com/malware-filter/urlhaus-filter"
    notes: "URLhaus malware hosts: yields about 1.9k domains because most of the file is bare IPs, which the sanitizer rejects."

  - id: metamask_phishing
    name: "MetaMask eth-phishing-detect"
    category: malicious
    url: "https://raw.githubusercontent.com/MetaMask/eth-phishing-detect/main/src/config.json"
    json_key: blacklist
    enabled: true
    tier: stable
    license: "https://github.com/MetaMask/eth-phishing-detect"
    notes: "Crypto phishing. Takes only the blacklist array, never fuzzylist or whitelist, to protect the household's exchange assets. Path entries are rejected and never block the parent domain."

  # ============================================================================
  # Firebog overrides (config/sources.firebog.yml is generated; do not edit it).
  # These ids are positional: recheck them after every `blocklist-factory sync-firebog`.
  # The first id wins and sources.yml loads first. tests/test_sources_config.py fails
  # if an id disappears or a retired URL ends up enabled.
  # ============================================================================
  - id: "firebog_advertising_7_fademind's_unchecky_ads"
    name: "Fademind's Unchecky Ads"
    category: advertising
    url: "https://raw.githubusercontent.com/FadeMind/hosts.extras/master/UncheckyAds/hosts"
    enabled: false
    notes: "Disabled: FadeMind repo archived."

  - id: "firebog_malicious_3_fademind's_risky_hosts"
    name: "Fademind's Risky Hosts"
    category: malicious
    url: "https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Risk/hosts"
    enabled: false
    notes: "Disabled: FadeMind repo archived."

  - id: "firebog_suspicious_2_fademind's_spammers"
    name: "Fademind's Spammers"
    category: suspicious
    url: "https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Spam/hosts"
    enabled: false
    notes: "Disabled: FadeMind repo archived."

  - id: "firebog_tracking_3_fademind's_2o7_network_tracker"
    name: "Fademind's 2o7 Network Trackers"
    category: tracking
    url: "https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.2o7Net/hosts"
    enabled: false
    notes: "Disabled: FadeMind repo archived."

  - id: "firebog_malicious_8_urlhaus_malicious_url_blocklis"
    name: "URLhaus Malicious URL blocklist"
    category: malicious
    url: "https://urlhaus.abuse.ch/downloads/hostfile/"
    enabled: false
    notes: "Disabled: urlhaus.abuse.ch returns 410; replaced by urlhaus_filter."

  - id: firebog_malicious_5_quidsup_malicious
    name: "Quidsup Malicious"
    category: malicious
    url: "https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-malware.txt"
    enabled: false
    notes: "Disabled: contributes 0 domains, 125 of 136 lines are parse_unsupported."
