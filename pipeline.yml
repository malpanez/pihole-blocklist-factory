# PaaS pipeline config — consumed by the paas shared library.
language: python
coverageThreshold: 90     # real gate: coverage is scoped to src/ and the project is 100%
security: true            # ruff+mypy+bandit+pip-audit+grype+checkov
sonarqube: false          # Sonar e2e pending (scanner + step-ca trust on the agent)
publishArtifacts: true    # publish the wheel/sdist to Nexus pypi-internal
