name: Build Lists

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode: full (fetch) or no-fetch"
        type: choice
        options:
          - full
          - no-fetch
        default: full
  schedule:
    - cron: "0 3 * * 0"   # weekly
    - cron: "0 3 1 * *"   # monthly

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build lists
        run: |
          if [ "${{ github.event.inputs.build_mode }}" = "no-fetch" ]; then
            uv run blocklist-factory build --no-fetch
          else
            uv run blocklist-factory build
          fi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lists-${{ github.run_id }}
          name: "Blocklists ${{ github.run_id }}"
          body: "Automated build from workflow run ${{ github.run_id }}"
          files: |
            dist/all.txt
            dist/allowlist.txt
            dist/regex.txt
            dist/categories/*.txt
            dist/profiles/*.txt
            dist/reports/*.json
            dist/reports/*.md
