name: Build Lists

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode: full (fetch) or no-fetch"
        type: choice
        options:
          - full
          - no-fetch
        default: full
  schedule:
    - cron: "0 3 * * 0"   # weekly
    - cron: "0 3 1 * *"   # monthly

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build lists
        run: |
          if [ "${{ github.event.inputs.build_mode }}" = "no-fetch" ]; then
            uv run blocklist-factory build --no-fetch
          else
            uv run blocklist-factory build
          fi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: "Blocklists (latest)"
          body: "Latest automated blocklist build. Run: ${{ github.run_id }}"
          make_latest: "true"
          files: |
            dist/all.txt
            dist/allowlist.txt
            dist/regex.txt
            dist/categories/*.txt
            dist/profiles/*.txt
            dist/profiles/manifest.json
            dist/reports/*.json
            dist/reports/*.md
