name: Update

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-build:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Save old stats
        run: |
          if [ -f dist/reports/stats.json ]; then
            cp dist/reports/stats.json /tmp/stats_old.json
          fi

      - name: Build (with fetch)
        run: uv run blocklist-factory build

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet dist/ 2>/dev/null; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: update blocklists"
          title: "chore: weekly blocklist update"
          body: "Automated weekly blocklist update. Review stats in dist/reports/stats.md"
          branch: chore/weekly-update
          delete-branch: true

      - name: Done
        if: steps.check.outputs.has_changes == 'false'
        run: echo "✓ No changes in blocklists"
